name: Release APK

on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle/**", "RELEASE_NOTES.md", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'hdlee73/Test-Antigravity' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 시크릿이 없어 릴리스를 중단합니다."
            exit 1
          fi

      - name: Restore keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare release files
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "etf-tracker-v$VERSION.apk"
          sha256sum "etf-tracker-v$VERSION.apk" > "etf-tracker-v$VERSION.apk.sha256"

      - name: Verify APK is signed
        run: |
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "etf-tracker-v$VERSION.apk" | head -n 3

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --notes-file RELEASE_NOTES.md
            gh release upload "v$VERSION" "etf-tracker-v$VERSION.apk" "etf-tracker-v$VERSION.apk.sha256" --clobber
          else
            gh release create "v$VERSION" "etf-tracker-v$VERSION.apk" "etf-tracker-v$VERSION.apk.sha256" \
              --target "$GITHUB_SHA" --title "ETF Tracker v$VERSION" --notes-file RELEASE_NOTES.md
          fi
